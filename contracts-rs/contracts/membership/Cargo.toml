[package]
name = "membership"
version = "0.1.0"
edition = "2021"
description = "Mint Gate soulbound membership Type Script (A1)"
license = "MIT"

[dependencies]
# CKB syscalls + high_level loaders for Type Script validation
ckb-std = "0.16.4"
# Pure-Rust blake2b-256 (no riscv gcc). Must match dApp `blake2bHexFromString`
# in lib/ckb/hash.ts (noble blake2b, dkLen=32, no CKB personalization).
blake2b-ref = "0.3.1"

[features]
default = []
library = []

[lib]
name = "membership"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "membership"
path = "src/main.rs"
